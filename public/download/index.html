<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NAMAZI — Download</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      background: #14532d;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: system-ui, sans-serif;
      color: white;
    }
    .container { text-align: center; padding: 2rem; }
    .emoji { font-size: 3rem; margin-bottom: 1rem; }
    p { color: #86efac; font-size: 1rem; }
  </style>
</head>
<body>
  <div class="container">
    <div class="emoji">🕌</div>
    <h1 style="font-size:1.5rem; margin-bottom:0.5rem;">NAMAZI</h1>
    <p>Redirecting you to the right store…</p>
  </div>
  <script>
    // GoatCounter site code — the dashboard lives at https://<code>.goatcounter.com
    var GOATCOUNTER_CODE = 'namazi';

    var ua = navigator.userAgent;
    var platform, target;
    if (/android/i.test(ua)) {
      platform = 'android';
      target = '/android-app';
    } else if (/iPad|iPhone|iPod/.test(ua) || (/Macintosh/.test(ua) && navigator.maxTouchPoints > 1)) {
      // iPadOS 13+ reports itself as a Mac, so detect it via touch support.
      platform = 'ios';
      target = '/ios-app';
    } else {
      platform = 'other';
      target = '/android-app';
    }

    // The QR code links to /download?src=qr, so scans are counted separately from link clicks.
    var params = new URLSearchParams(window.location.search);

    var source = params.get('src') || 'link';

    // Keep source and campaign names safe and consistent
    function clean(value) {
      return value.toLowerCase().replace(/[^a-z0-9_-]/g, '_').slice(0, 40);
    }
    source = clean(source);

    // Optional campaign, e.g. /download?campaign=launch&src=imam
    var campaign = clean(params.get('campaign') || params.get('utm_campaign') || '');

    var redirected = false;
    function go() {
      if (redirected) return;
      redirected = true;
      // Pass the source on so the store page can tag the Play Store link with it.
      window.location.replace(target + '?src=' + source);
    }

    // Record the hit in GoatCounter, then redirect once it is sent (or after 1s at most).
    var pixel = new Image();
    pixel.onload = pixel.onerror = go;
    // GoatCounter reads the campaign (utm_campaign) and its source (utm_source) from the q parameter,
    // e.g. ?campaign=launch&src=imam shows as campaign "launch" with source "imam".
    // GoatCounter ignores q for events, so this hit is sent as a pageview (no e=true).
    var queryParams = campaign
      ? 'utm_campaign=' + encodeURIComponent(campaign) + '&utm_source=' + encodeURIComponent(source)
      : '';
    pixel.src = 'https://' + GOATCOUNTER_CODE + '.goatcounter.com/count'
      + '?p=' + encodeURIComponent('/' + source + '-' + platform)
      + '&t=' + encodeURIComponent('Download ' + source + ' (' + platform + ')'
          + (campaign ? ' – ' + campaign : ''))
      + '&q=' + encodeURIComponent(queryParams)
      + '&rnd=' + Math.random().toString(36).slice(2);
    setTimeout(go, 1000);
  </script>
</body>
</html>
