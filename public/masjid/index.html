<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NAMAZI — View Masjid</title>
  <meta name="description" content="View this masjid's prayer times in the NAMAZI app." />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      background: linear-gradient(135deg, #052e16, #14532d, #15803d);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: system-ui, sans-serif;
      color: white;
      padding: 2rem;
    }
    .card {
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 1.5rem;
      padding: 2.5rem 2rem;
      text-align: center;
      max-width: 360px;
      width: 100%;
    }
    .emoji { font-size: 4rem; margin-bottom: 1rem; display: block; }
    .app-name {
      font-size: 2rem;
      font-weight: 700;
      color: #fbbf24;
      margin-bottom: 1rem;
      letter-spacing: 0.05em;
    }
    .message {
      color: #bbf7d0;
      font-size: 1rem;
      line-height: 1.6;
      margin-bottom: 2rem;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 0.6rem;
      background: #fbbf24;
      color: #052e16;
      font-weight: 700;
      font-size: 1rem;
      padding: 0.9rem 2rem;
      border-radius: 9999px;
      text-decoration: none;
      transition: background 0.2s;
    }
    .btn:hover { background: #f59e0b; }
    .open { margin-top: 1.25rem; }
    .open a, .back a {
      color: #86efac;
      font-size: 0.9rem;
      text-decoration: none;
      opacity: 0.85;
    }
    .open a:hover, .back a:hover { opacity: 1; }
    .back { margin-top: 1.5rem; }
    .hidden { display: none; }
  </style>
</head>
<body>
  <div class="card">
    <span class="emoji">🕌</span>
    <div class="app-name">NAMAZI</div>
    <p class="message" id="msg">
      Someone shared a masjid with you.<br/><br/>
      Install NAMAZI from Google Play — after you sign in, the masjid will open automatically.
    </p>
    <a id="install" href="https://play.google.com/store/apps/details?id=com.namazi.mobile" class="btn">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor">
        <path d="M3.18 23.76c.3.17.64.24.99.2L15.9 12 12 8.1 3.18 23.76zM20.77 10.49l-2.6-1.49-4.17 3.99 4.17 4 2.62-1.5c.75-.43.75-1.57-.02-2.5v.5zM1.8.3C1.54.56 1.4.97 1.4 1.5v21c0 .53.14.94.4 1.2L2 23.9l11.5-11.5v-.4L2 .5l-.2-.2zM15.9 12l3.17-3.17-2.6-1.5L12 9.9 15.9 12z"/>
      </svg>
      Get it on Google Play
    </a>
    <div class="open hidden" id="openWrap"><a id="open" href="#">Already have the app? Open the masjid</a></div>
    <div class="back"><a href="/">← Back to namazi-app.com</a></div>
  </div>
  <script>
    // Shared-masjid links look like https://namazi-app.com/masjid/<id>.
    // GitHub Pages can't rewrite, so 404.html forwards those to /masjid/?id=<id>.
    // This page is only reached when the NAMAZI app isn't installed (or its
    // App Links aren't verified) — otherwise Android opens the app directly.
    (function () {
      var PACKAGE = 'com.namazi.mobile';
      var params = new URLSearchParams(location.search);
      var pathMatch = location.pathname.match(/\/masjid\/([^\/?#]+)/);
      var masjidId = params.get('id') || (pathMatch ? decodeURIComponent(pathMatch[1]) : '');

      // The app reads `masjid=<id>` from the Play install referrer on first launch.
      var storeUrl = 'https://play.google.com/store/apps/details?id=' + PACKAGE +
        (masjidId ? '&referrer=' + encodeURIComponent('masjid=' + masjidId) : '');
      document.getElementById('install').href = storeUrl;

      if (!/android/i.test(navigator.userAgent)) {
        document.getElementById('msg').innerHTML =
          'Someone shared a masjid with you.<br/><br/>NAMAZI is currently available on Android — open this link on an Android phone to view it.';
        return;
      }

      if (masjidId) {
        // Opens the app if installed, otherwise Chrome falls back to the Play Store.
        document.getElementById('open').href = 'intent://masjid/' + encodeURIComponent(masjidId) +
          '#Intent;scheme=namazi;package=' + PACKAGE +
          ';S.browser_fallback_url=' + encodeURIComponent(storeUrl) + ';end';
        document.getElementById('openWrap').classList.remove('hidden');
      }

      setTimeout(function () { location.href = storeUrl; }, 1500);
    })();
  </script>
</body>
</html>
